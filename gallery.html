<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফটো গ্যালারি ও আর্काइভ - ৭ নং অভয়পাশা সরকারি প্রাথমিক বিদ্যালয়</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #eef2f1;
            color: #2c3e50;
            line-height: 1.5;
            font-size: 11pt;
        }
        .app-header {
            background: linear-gradient(135deg, #1b4d3e, #2d6a4f);
            color: white;
            padding: 15px 25px;
            border-bottom: 4px solid #ffb300;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 { font-size: 18pt; margin-bottom: 5px; }
        .header-title p { font-size: 10pt; opacity: 0.9; }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .gallery-card {
            background: #ffffff;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-top: 3px solid #2d6a4f;
            text-align: center;
        }
        .main-display {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 6px;
            border: 2px solid #ddd;
            background-color: #000;
            margin-bottom: 15px;
        }
        .main-video {
            width: 100%;
            height: 400px;
            border-radius: 6px;
            border: 2px solid #ddd;
            margin-bottom: 15px;
            display: none;
        }
        .caption-box {
            font-size: 13pt;
            font-weight: bold;
            color: #1b4d3e;
            margin-bottom: 20px;
            padding: 10px;
            background: #fffdf0;
            border: 1px dashed #f39c12;
            border-radius: 4px;
            border-left: 4px solid #ffb300;
            outline: none;
            cursor: text;
        }
        .upload-panel {
            background: #f8f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            text-align: left;
        }
        .upload-panel h3 {
            font-size: 11pt;
            margin-bottom: 10px;
            color: #1b4d3e;
        }
        .upload-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            align-items: center;
        }
        .upload-row input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 10pt;
        }
        .btn-action {
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10pt;
        }
        .btn-action:hover { background-color: #1b4d3e; }
        .btn-video { background-color: #8e44ad; }
        .btn-video:hover { background-color: #732d91; }
        
        .thumbnail-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .thumb-wrapper {
            position: relative;
            display: inline-block;
        }
        .thumb {
            width: 90px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid #ccc;
            transition: 0.2s;
        }
        .thumb:hover, .thumb.active {
            border-color: #ffb300;
            transform: scale(1.05);
        }
        .nav-back {
            display: inline-block;
            margin-bottom: 15px;
            color: #1b4d3e;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-back:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="header-title">
                <h1>৭ নং অভয়পাশা সরকারি প্রাথমিক বিদ্যালয়</h1>
                <p>স্মৃতিচারণ ও ফটো ও ভিডিও গ্যালারি</p>
            </div>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="nav-back">← মূল ড্যাশবোর্ডে ফিরে যান</a>

        <div class="upload-panel">
            <h3>➕ গ্যালারিতে ছবি বা ভিডিও যোগ করুন</h3>
            
            <div class="upload-row">
                <label style="font-size: 10pt; font-weight: bold; min-width: 110px;">একাধিক ছবি:</label>
                <input type="file" id="imageFileInput" accept="image/*" multiple onchange="uploadMultipleImages(event)" style="font-size: 10pt;">
            </div>

            <div class="upload-row">
                <label style="font-size: 10pt; font-weight: bold; min-width: 110px;">ছবির লিংক:</label>
                <input type="text" id="imageUrlInput" placeholder="অনলাইন ছবির লিংক (URL) পেস্ট করুন...">
                <button class="btn-action" onclick="addOnlineImage()">ছবি যুক্ত করুন</button>
            </div>

            <div class="upload-row">
                <label style="font-size: 10pt; font-weight: bold; min-width: 110px;">ভিডিও লিংক:</label>
                <input type="text" id="videoUrlInput" placeholder="ইউটিউব ভিডিওর লিংক এখানে পেস্ট করুন...">
                <button class="btn-action btn-video" onclick="addVideoItem()">ভিডিও যুক্ত করুন</button>
            </div>
        </div>

        <div class="gallery-card">
            <img id="mainImage" src="1769399341413.jpg" alt="Gallery Image" class="main-display">
            <iframe id="mainVideo" class="main-video" src="" frameborder="0" allowfullscreen></iframe>
            
            <div id="imageCaption" class="caption-box" contenteditable="true">‘মৌলিক প্রশিক্ষণ’ কোর্স-২০২৬ এর ব্যাচ ভিত্তিক ফটো সেশন</div>

            <div class="thumbnail-container" id="thumbContainer">
                <div class="thumb-wrapper">
                    <img src="1769399341413.jpg" class="thumb active" data-type="image" onclick="changeMedia(this, '‘মৌলিক প্রশিক্ষণ’ কোর্স-২০২৬ এর ব্যাচ ভিত্তিক ফটো সেশন')">
                </div>
                <div class="thumb-wrapper">
                    <img src="1787923812582.jpg" class="thumb" data-type="image" onclick="changeMedia(this, 'বিদ্যালয়ের বিভিন্ন কার্যক্রম ও মনিটরিং মুহূর্ত')">
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeMedia(element, defaultCaption) {
            const mainImg = document.getElementById('mainImage');
            const mainVideo = document.getElementById('mainVideo');
            const mediaType = element.getAttribute('data-type');

            if (mediaType === 'video') {
                mainImg.style.display = 'none';
                mainVideo.style.display = 'block';
                mainVideo.src = element.src; // এখানে ভিডিওর এমবেড লিংক থাকবে
            } else {
                mainVideo.style.display = 'none';
                mainImg.style.display = 'block';
                mainImg.src = element.src;
            }
            
            const savedCaption = localStorage.getItem('caption_' + element.src);
            document.getElementById('imageCaption').innerText = savedCaption ? savedCaption : defaultCaption;

            let thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach(thumb => thumb.classList.remove('active'));
            element.classList.add('active');
        }

        // একসাথে একাধিক ছবি আপলোড হ্যান্ডলার
        function uploadMultipleImages(event) {
            const files = event.target.files;
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        addNewThumbToGallery(e.target.result, 'আপলোড করা ছবি', 'image');
                    }
                    reader.readAsDataURL(file);
                }
            }
        }

        // অনলাইন লিংক থেকে ছবি যুক্ত করা
        function addOnlineImage() {
            const urlInput = document.getElementById('imageUrlInput');
            const url = urlInput.value.trim();
            if (url) {
                addNewThumbToGallery(url, 'অনলাইন থেকে যুক্ত ছবি', 'image');
                urlInput.value = '';
            } else {
                alert('দয়া করে একটি সঠিক ছবির লিংক দিন।');
            }
        }

        // ইউটিউব ভিডিও লিংক যুক্ত করা
        function addVideoItem() {
            const urlInput = document.getElementById('videoUrlInput');
            let url = urlInput.value.trim();
            if (url) {
                if (url.includes('watch?v=')) {
                    url = url.replace('watch?v=', 'embed/');
                } else if (url.includes('youtu.be/')) {
                    url = url.replace('youtu.be/', 'www.youtube.com/embed/');
                }
                // ভিডিওর থাম্বনেইলের জন্য ইউটিউবের লোগো বা ডিফল্ট আইকন ব্যবহার করা যেতে পারে
                addNewThumbToGallery(url, 'বিদ্যালয়ের ভিডিও ক্লিপ', 'video');
                urlInput.value = '';
            } else {
                alert('দয়া করে একটি সঠিক ইউটিউব ভিডিও লিংক দিন।');
            }
        }

        // গ্যালারিতে নতুন থাম্বনেইল যোগ করার কমন ফাংশন
        function addNewThumbToGallery(mediaSrc, defaultCaption, type) {
            const container = document.getElementById('thumbContainer');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'thumb-wrapper';

            const newThumb = document.createElement('img');
            
            if (type === 'video') {
                // ভিডিওর জন্য থাম্বনেইলে একটি প্লে আইকনযুক্ত প্রিভিউ দেখানো বা ডিফল্ট ইমেজ সেট করা
                newThumb.src = 'https://img.icons8.com/color/96/youtube-play.png';
                newThumb.style.background = '#000';
            } else {
                newThumb.src = mediaSrc;
            }

            newThumb.className = 'thumb';
            newThumb.setAttribute('data-type', type);
            // ভিডিওর ক্ষেত্রে সোর্স হিসেবে আসল এমবেড লিংকটি সেভ করে রাখা
            if(type === 'video') {
                newThumb.src = mediaSrc; // সরাসরি আইফ্রেমের সোর্স হিসেবে কাজ করবে
            }

            newThumb.onclick = function() {
                changeMedia(this, defaultCaption);
            };

            wrapper.appendChild(newThumb);
            container.appendChild(wrapper);

            newThumb.click();
        }

        // ক্যাপশন এডিট ও লোকালস্টোরেজে সেভ করা
        document.getElementById('imageCaption').addEventListener('input', function() {
            const mainImg = document.getElementById('mainImage');
            const mainVideo = document.getElementById('mainVideo');
            const activeThumb = document.querySelector('.thumb.active');
            if (activeThumb) {
                localStorage.setItem('caption_' + activeThumb.src, this.innerText);
            }
        });
    </script>
</body>
</html>
