<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রধান শিক্ষকদের কার্যকাল - ৭ নং অভয়পাশা সরকারি প্রাথমিক বিদ্যালয়</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #eef2f1;
            color: #2c3e50;
            line-height: 1.5;
            font-size: 11pt;
        }
        .app-header {
            background: linear-gradient(135deg, #1b4d3e, #2d6a4f);
            color: white;
            padding: 15px 25px;
            border-bottom: 4px solid #ffb300;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 { font-size: 18pt; margin-bottom: 5px; }
        .header-title p { font-size: 10pt; opacity: 0.9; }
        .mode-indicator {
            background: #ffb300;
            color: #000;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 9.5pt;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .section-card {
            background: #ffffff;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-top: 3px solid #2d6a4f;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eef2f1;
        }
        .section-header h2 { font-size: 13pt; color: #1b4d3e; }
        .add-row-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'SolaimanLipi', sans-serif;
            font-size: 9.5pt;
        }
        .add-row-btn:hover { background-color: #219653; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            border: 1px solid #dcdcdc;
            padding: 8px 10px;
            text-align: center;
            font-size: 10.5pt;
        }
        th { background-color: #f4f6f6; color: #1b4d3e; }
        td[contenteditable="true"] {
            background-color: #fffdf0;
            border: 1px dashed #f39c12;
        }
        .action-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9pt;
        }
        .action-btn:hover { background-color: #c0392b; }
        .nav-back {
            display: inline-block;
            margin-bottom: 15px;
            color: #1b4d3e;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-back:hover { text-decoration: underline; }
    </style>
</head>
<body id="appBody">

    <header class="app-header">
        <div class="header-top">
            <div class="header-title">
                <h1>৭ নং অভয়পাশা সরকারি প্রাথমিক বিদ্যালয়</h1>
                <p>প্রধান শিক্ষকগণের কার্যকাল রেকর্ড</p>
            </div>
            <div id="modeIndicator" class="mode-indicator">এডিট মোড সচল</div>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="nav-back">← মূল ড্যাশবোর্ডে ফিরে যান</a>

        <div class="section-card">
            <div class="section-header">
                <h2>প্রধান শিক্ষকগণের দায়িত্ব পালনের ইতিহাস</h2>
                <button class="add-row-btn" onclick="addRow()">+ সারি যোগ করুন</button>
            </div>
            <table id="headmasterTable">
                <thead>
                    <tr>
                        <th style="width: 15%;">ক্রমিক</th>
                        <th style="width: 45%;">প্রধান শিক্ষকের নাম</th>
                        <th style="width: 30%;">সময়কাল</th>
                        <th style="width: 10%;">অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>১</td>
                        <td contenteditable="true">জনাব মোজাম্মেল হক</td>
                        <td contenteditable="true">২০১০ - ২০১৯</td>
                        <td><button class="action-btn" onclick="deleteRow(this)">মুছুন</button></td>
                    </tr>
                    <tr>
                        <td>২</td>
                        <td contenteditable="true">Md. Moniruzzaman Babul</td>
                        <td contenteditable="true">২০১৯ - বর্তমান</td>
                        <td><button class="action-btn" onclick="deleteRow(this)">মুছুন</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function autoSave() {
            localStorage.setItem('abhoypasha_headmaster_data', document.body.innerHTML);
        }
        document.addEventListener('input', autoSave);

        function addRow() {
            const table = document.getElementById('headmasterTable').getElementsByTagName('tbody')[0];
            const rowCount = table.rows.length + 1;
            const newRow = table.insertRow();
            newRow.innerHTML = `
                <td>${rowCount}</td>
                <td contenteditable="true">নাম লিখুন</td>
                <td contenteditable="true">সময়কাল লিখুন</td>
                <td><button class="action-btn" onclick="deleteRow(this)">মুছুন</button></td>
            `;
            autoSave();
        }

        window.onload = function() {
            const savedData = localStorage.getItem('abhoypasha_headmaster_data');
            if (savedData) {
                document.body.innerHTML = savedData;
            }
        };
    </script>
</body>
</html>
